[project]
name = "intelligent-search"
version = "0.1.0"
description = "AI-powered e-commerce search (case study MVP)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "opensearch-py[async]>=2.6",
    "psycopg[binary,pool]>=3.1",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "aiokafka>=0.11",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "symspellpy>=6.7",
    "prometheus-fastapi-instrumentator>=7.0",
    "prometheus-client>=0.20",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "polars>=1.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
ml = [
    "lightgbm>=4.3",
    "duckdb>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "libs/common/src/common",
    "services/genai_gateway/src/genai_gateway",
    "services/search_service/src/search_service",
    "pipelines",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["common", "pipelines", "genai_gateway", "search_service"]
